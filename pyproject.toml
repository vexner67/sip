[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siplang"
version = "0.2.0"
description = "Sip: a token-efficient language compiled to native code via C"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
sip = "siplang.cli:main"

[tool.setuptools]
packages = ["siplang"]

[tool.setuptools.package-data]
siplang = ["native/*.h"]
